<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tanguy Design — Cockpit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#F7F4EF;color:#1A1916;min-height:100vh}
header{background:#fff;padding:20px 24px;border-bottom:1px solid #E5E0D8;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;font-weight:500}
main{padding:32px 24px;max-width:1100px;margin:0 auto}
.card{background:#fff;padding:24px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.muted{color:#8A8680;font-size:13px}
button{padding:8px 14px;border:1px solid #E5E0D8;background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#FAFAF7}
</style>
</head>
<body>
<header>
  <h1>Tanguy Design</h1>
  <div><span class="muted" id="who"></span> <button onclick="logout()">Déconnexion</button></div>
</header>
<main>
  <div class="card">
    <h2 style="font-size:16px;margin-bottom:8px">Bienvenue</h2>
    <p class="muted">Cockpit en cours de construction. Les modules (Clients, Projets, Artisans, Commandes, Tâches, SAV) arrivent.</p>
  </div>
  <div class="card">
    <h2 style="font-size:14px;margin-bottom:8px">État système</h2>
    <pre id="health" class="muted" style="font-size:11px;font-family:monospace"></pre>
  </div>
</main>
<script>
fetch('/api/me').then(r=>r.json()).then(d=>{document.getElementById('who').textContent=d.user||''});
fetch('/api/health').then(r=>r.json()).then(d=>{document.getElementById('health').textContent=JSON.stringify(d,null,2)});
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login';}
</script>
</body>
</html>
