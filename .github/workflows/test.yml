name: CI tests

on:
  push:
    branches:
      # `main` n'y figure plus (18/10/2026) : sur main, cette suite est APPELÉE par deploy-scaleway.yml
      # (job `tests`, via `workflow_call`) avant le build — rouge, rien ne part. La jouer ici en plus
      # doublait les minutes GitHub pour le même arbre.
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'server.js'
      - 'services/**'
      - 'website/**'
      - 'scripts/**'
      - 'public/v3/assets/js/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
  # Appelable par deploy-scaleway.yml : une seule définition de la suite, qui bloque le déploiement.
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Syntax check server.js
        run: npm run smoke

      - name: Syntax check tous scripts
        run: for f in scripts/*.js; do node --check "$f" || exit 1; done

      # Valide chaque module ES front comme le ferait un navigateur (mode strict).
      # `node --check` seul parse en mode script laxiste : une fonction déclarée 2×
      # ne lève PAS d'erreur → collision au merge invisible en CI mais fatale en prod
      # (écran figé « Chargement… », incident admin.js/renderMarges du 2026-07-01).
      # `--input-type=module` force le mode module strict qui, lui, échoue.
      - name: Valide modules ES front (mode strict navigateur)
        run: |
          fail=0
          while IFS= read -r f; do
            if ! node --check --input-type=module - < "$f"; then
              echo "::error file=$f::Module ES invalide en mode strict — $f"
              fail=1
            fi
          done < <(find public/v3/assets/js -type f -name '*.js' | sort)
          if [ "$fail" -ne 0 ]; then
            echo "Au moins un module ES front ne parse pas en mode strict — build échoué."
            exit 1
          fi
          echo "OK — tous les modules ES front parsent en mode strict navigateur."

      - name: Run tests
        run: npm test
