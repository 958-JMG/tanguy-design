<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tanguy Design — Espace chantier</title>
  <style>
    :root{ --bg:#161412; --card:#211d1a; --card2:#2a2521; --line:#3a332d;
           --ink:#F4ECDC; --muted:#9a9184; --gold:#C89B5A; --accent:#C75F2D; --ok:#6B8E54; }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{ margin:0; background:var(--bg); color:var(--ink);
          font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
          padding-bottom:env(safe-area-inset-bottom); }
    header{ position:sticky; top:0; z-index:10; background:rgba(22,20,18,.96);
            backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
            display:flex; align-items:center; gap:10px; padding:14px 16px calc(14px);
            padding-top:calc(14px + env(safe-area-inset-top)); }
    header .title{ font-size:17px; font-weight:600; flex:1; white-space:nowrap;
                   overflow:hidden; text-overflow:ellipsis; }
    button{ font:inherit; cursor:pointer; }
    .icon-btn{ background:var(--card2); color:var(--ink); border:1px solid var(--line);
               border-radius:10px; padding:8px 12px; font-size:14px; }
    .icon-btn:active{ background:var(--line); }
    main{ padding:14px 16px 40px; max-width:640px; margin:0 auto; }
    .chantier{ background:var(--card); border:1px solid var(--line); border-radius:14px;
               padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:12px; }
    .chantier:active{ background:var(--card2); }
    .chantier .nom{ font-size:16px; font-weight:600; }
    .chantier .sub{ font-size:13px; color:var(--muted); margin-top:3px; }
    .chantier .chev{ margin-left:auto; color:var(--gold); font-size:22px; }
    .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em;
                    color:var(--gold); margin:22px 2px 10px; font-weight:600;
                    display:flex; align-items:center; gap:8px; }
    .section-title .count{ color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; }
    .grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .thumb{ position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden;
            background:var(--card2); border:1px solid var(--line); display:block; }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumb .del{ position:absolute; top:4px; right:4px; width:30px; height:30px;
                 border-radius:50%; border:none; background:rgba(0,0,0,.6); color:#fff;
                 font-size:15px; line-height:30px; text-align:center; padding:0; }
    .file{ display:flex; align-items:center; gap:10px; background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:11px 13px;
           margin-bottom:8px; color:var(--ink); text-decoration:none; font-size:14px; }
    .file .ext{ background:var(--accent); color:#fff; font-size:10px; font-weight:700;
                padding:3px 6px; border-radius:5px; text-transform:uppercase; }
    .file .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty{ color:var(--muted); font-size:13px; padding:8px 2px; }
    .add-photo{ display:block; width:100%; text-align:center; background:var(--gold);
                color:#1a1613; border:none; border-radius:12px; padding:15px;
                font-size:16px; font-weight:600; margin:4px 0 6px; }
    .add-photo:active{ filter:brightness(.92); }
    .add-photo input{ display:none; }
    .loading,.msg{ color:var(--muted); text-align:center; padding:40px 0; font-size:14px; }
    .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:50;
            background:#111; color:#fff; border:1px solid var(--line); padding:12px 18px;
            border-radius:10px; font-size:14px; max-width:90%; box-shadow:0 8px 30px rgba(0,0,0,.5);
            opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.show{ opacity:1; }
    .toast.err{ border-color:var(--accent); }
    .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:60;
               display:none; align-items:center; justify-content:center; padding:16px; }
    .lightbox.show{ display:flex; }
    .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }
  </style>
</head>
<body>
  <header>
    <button id="back" class="icon-btn" style="display:none">←</button>
    <div class="title" id="title">Chantiers</div>
    <button id="logout" class="icon-btn">Quitter</button>
  </header>
  <main id="view"><div class="loading">Chargement…</div></main>
  <div class="toast" id="toast"></div>
  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>
  <script src="/assets/js/poseur.js" defer></script>
</body>
</html>
